name: Android cloud AAB build

on:
  push:
    branches:
      - feature/master-income-command-center
    paths:
      - "android-app/**"
      - ".github/workflows/android-cloud-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-cloud-build.yml"
  workflow_dispatch:
    inputs:
      project_path:
        description: Path to the Android Gradle project inside this repository
        required: true
        default: android-app
        type: string
      variant:
        description: Debug builds need no signing secrets; release builds require the owner's keystore secrets
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate Android project
        env:
          PROJECT_PATH: ${{ inputs.project_path || 'android-app' }}
        run: |
          set -euo pipefail
          if [[ "$PROJECT_PATH" == *".."* || "$PROJECT_PATH" == /* ]]; then
            echo "project_path must be a relative path inside the repository."
            exit 1
          fi
          if [[ ! -f "$PROJECT_PATH/settings.gradle" && ! -f "$PROJECT_PATH/settings.gradle.kts" ]]; then
            echo "No settings.gradle or settings.gradle.kts found at $PROJECT_PATH."
            exit 1
          fi
          if [[ ! -f "$PROJECT_PATH/gradlew" && ! -f "$PROJECT_PATH/build.gradle" && ! -f "$PROJECT_PATH/build.gradle.kts" ]]; then
            echo "No Gradle wrapper or root build file found at $PROJECT_PATH."
            exit 1
          fi

      - name: Prepare release signing key
        if: inputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Release build requires ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD GitHub Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/master-ai-release.keystore"
          chmod 600 "$RUNNER_TEMP/master-ai-release.keystore"

      - name: Build debug Android App Bundle
        if: inputs.variant != 'release'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon bundleDebug
          else
            gradle --no-daemon bundleDebug
          fi

      - name: Build signed release Android App Bundle
        if: inputs.variant == 'release'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/master-ai-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon bundleRelease
          else
            gradle --no-daemon bundleRelease
          fi

      - name: Locate and verify AAB
        id: locate_aab
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          BUILD_VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          set -euo pipefail
          AAB="$(find "$PROJECT_PATH" -type f -path "*/outputs/bundle/$BUILD_VARIANT/*.aab" -print -quit)"
          if [[ -z "$AAB" ]]; then
            echo "Gradle completed but no $BUILD_VARIANT AAB was found."
            exit 1
          fi
          if [[ "$BUILD_VARIANT" == "release" ]]; then
            VERIFY_LOG="$RUNNER_TEMP/aab-signature-check.txt"
            if ! jarsigner -verify -verbose -certs "$AAB" > "$VERIFY_LOG" 2>&1; then
              cat "$VERIFY_LOG"
              exit 1
            fi
            if ! grep -q "jar verified" "$VERIFY_LOG"; then
              cat "$VERIFY_LOG"
              echo "Release AAB is not signed. Configure the release signing block described in docs/android-cloud-build.md."
              exit 1
            fi
          fi
          sha256sum "$AAB" | tee "$RUNNER_TEMP/aab-sha256.txt"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: master-ai-android-${{ inputs.variant || 'debug' }}-${{ github.sha }}
          path: |
            ${{ steps.locate_aab.outputs.aab_path }}
            ${{ runner.temp }}/aab-sha256.txt
          if-no-files-found: error
          retention-days: 14
