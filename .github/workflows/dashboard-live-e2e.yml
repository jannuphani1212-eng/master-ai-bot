name: Live dashboard button browser test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        run: npm install
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start the pull-request app locally
        run: |
          node server.js > /tmp/master-ai-bot.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/master-ai-bot.log
          exit 1
      - name: Test all six agent sections and Income Centre
        env:
          MASTER_AI_BASE_URL: http://127.0.0.1:3000
        run: node scripts/dashboard-live-buttons.js
