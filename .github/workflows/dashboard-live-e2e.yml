name: Live dashboard button browser test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        run: npm install
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all six live dashboard buttons
        env:
          MASTER_AI_BASE_URL: https://master-ai-bot-iskj.onrender.com
        run: node scripts/dashboard-live-buttons.js
