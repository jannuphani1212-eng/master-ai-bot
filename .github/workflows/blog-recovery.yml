name: Master AI Bot Blogging-only recovery
# Recovery is successful only after a private Blogger draft is actually delivered
# and the application records a passed editorial/artifact acceptance gate.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blog-recovery.yml

permissions:
  contents: read

concurrency:
  group: master-ai-bot-blog-recovery
  cancel-in-progress: false

jobs:
  recover-blogging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recover and verify a private Blogging draft
        env:
          MASTER_AI_BOT_URL: https://master-ai-bot-iskj.onrender.com
          SCHEDULER_SHARED_SECRET: ${{ secrets.SCHEDULER_SHARED_SECRET }}
        run: |
          set -euo pipefail
          # Allow the Render auto-deploy from this commit to become live before calling the service.
          sleep 75
          triggered=0
          for attempt in $(seq 1 40); do
            status="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${SCHEDULER_SHARED_SECRET}" \
              "${MASTER_AI_BOT_URL}/api/internal/daily-status")"
            printf '%s\n' "$status"

            latest_blog="$(printf '%s' "$status" | jq -c '
              [.recoveryJobs[] | select(.agent_id == "blogging")]
              | sort_by(.created_at) | last // empty
            ')"
            blog_state="$(printf '%s' "$latest_blog" | jq -r '.status // empty')"

            if [ "$blog_state" = "completed" ]; then
              delivery_ok="$(printf '%s' "$latest_blog" | jq -r '
                (.result.success == true)
                and (.result.artifactAcceptance.complete == true)
                and (
                  .result.savedAssets.bloggerDraftCreated == true
                  or .result.savedAssets.bloggerDraftAlreadyCreated == true
                )
              ')"
              if [ "$delivery_ok" = "true" ]; then
                echo "Verified: editorial gate passed and a private Blogger draft was delivered. Publishing remains owner-approval-only."
                exit 0
              fi
              echo "Queue generation completed, but editorial acceptance or private Blogger draft delivery is not verified. This is NOT a successful recovery." >&2
              printf '%s\n' "$latest_blog" | jq '{status, result_success: .result.success, artifactAcceptance: .result.artifactAcceptance, savedAssets: .result.savedAssets, last_error}'
              exit 1
            fi

            if [ "$blog_state" = "failed" ] && [ "$triggered" -eq 1 ]; then
              blog_error="$(printf '%s' "$latest_blog" | jq -r '.last_error // "No failure detail returned."')"
              echo "Blogging recovery failed after its one allowed trigger: $blog_error" >&2
              exit 1
            fi

            if [ "$triggered" -eq 0 ]; then
              response="$(curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${SCHEDULER_SHARED_SECRET}" \
                --header "Content-Type: application/json" \
                "${MASTER_AI_BOT_URL}/api/internal/blog-retry")"
              printf 'Single recovery trigger: %s\n' "$response"
              triggered=1
            fi
            if [ "$attempt" -lt 40 ]; then sleep 30; fi
          done
          echo "Blogging recovery did not reach verified private-draft delivery within 20 minutes." >&2
          exit 1
