name: Master AI Bot daily autonomous operations

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-ai-bot-daily-operations
  cancel-in-progress: false

jobs:
  daily-production:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Master AI Bot
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the persistent daily queue
        run: node scripts/daily-scheduler.js
        env:
          MASTER_AI_BOT_URL: "https://master-ai-bot-iskj.onrender.com"
          SCHEDULER_SHARED_SECRET: ${{ secrets.SCHEDULER_SHARED_SECRET }}
