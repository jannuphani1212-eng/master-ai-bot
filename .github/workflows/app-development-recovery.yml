name: Master AI Bot App Development recovery
# Re-run the owner-scoped prototype generator after the review-routing fix.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/app-development-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-ai-bot-app-development-recovery-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate and save an App Development project
        env:
          MASTER_AI_BOT_URL: https://master-ai-bot-iskj.onrender.com
          SCHEDULER_SHARED_SECRET: ${{ secrets.SCHEDULER_SHARED_SECRET }}
        run: |
          set -euo pipefail
          # Allow the Render auto-deploy from this commit to become live before calling the service.
          sleep 75
          if [[ -z "${MASTER_AI_BOT_URL:-}" || -z "${SCHEDULER_SHARED_SECRET:-}" ]]; then
            echo "Required scheduler secrets are not configured."
            exit 1
          fi

          # Start one fresh App Development recovery for this workflow run.
          initial_trigger="$(curl --max-time 20 -sS -X POST "${MASTER_AI_BOT_URL%/}/api/internal/app-development-retry" \
            -H "Authorization: Bearer $SCHEDULER_SHARED_SECRET" || true)"
          echo "Initial App Development trigger response: $initial_trigger"

          for attempt in $(seq 1 40); do
            status_response="$(curl --max-time 20 -sS "${MASTER_AI_BOT_URL%/}/api/internal/daily-status" \
              -H "Authorization: Bearer $SCHEDULER_SHARED_SECRET" || true)"
            day_key="$(echo "$status_response" | jq -r '.dayKey // empty' 2>/dev/null || true)"
            job_status=""
            if [[ -n "$day_key" ]]; then
              prefix="daily:${day_key}:app-development:recovery:"
              job_status="$(echo "$status_response" | jq -r --arg prefix "$prefix" '([.jobs[]? | select((.idempotency_key // "") | startswith($prefix))] | sort_by(.created_at // "") | last | .status) // empty' 2>/dev/null || true)"
            fi

            echo "App Development recovery status: ${job_status:-not-yet-visible}"
            if [[ "$job_status" == "completed" ]]; then
              echo "App Development source generation job completed. Check the owner workspace for files and static validation."
              exit 0
            fi

            trigger_response="$(curl --max-time 20 -sS -X POST "${MASTER_AI_BOT_URL%/}/api/internal/app-development-retry" \
              -H "Authorization: Bearer $SCHEDULER_SHARED_SECRET" || true)"
            echo "App Development trigger response: $trigger_response"

            sleep 30
          done

          echo "App Development recovery did not finish within the monitoring window."
          exit 1
