name: Master AI Bot App Development recovery
# Re-run the owner-scoped prototype generator after the review-routing fix.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-ai-bot-app-development-recovery-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate and save an App Development project
        env:
          MASTER_AI_BOT_URL: https://master-ai-bot-iskj.onrender.com
          SCHEDULER_SHARED_SECRET: ${{ secrets.SCHEDULER_SHARED_SECRET }}
        run: |
          set -euo pipefail
          # Allow the Render auto-deploy from this commit to become live before calling the service.
          sleep 75
          if [[ -z "${MASTER_AI_BOT_URL:-}" || -z "${SCHEDULER_SHARED_SECRET:-}" ]]; then
            echo "Required scheduler secrets are not configured."
            exit 1
          fi

          # Trigger once, then only poll. Never enqueue another job on every poll.
          initial_trigger="$(curl --fail-with-body --max-time 20 -sS -X POST "${MASTER_AI_BOT_URL%/}/api/internal/app-development-retry" \
            -H "Authorization: Bearer $SCHEDULER_SHARED_SECRET")"
          echo "Initial App Development trigger response: $initial_trigger"

          for attempt in $(seq 1 40); do
            status_response="$(curl --fail-with-body --max-time 20 -sS "${MASTER_AI_BOT_URL%/}/api/internal/daily-status" \
              -H "Authorization: Bearer $SCHEDULER_SHARED_SECRET")"
            day_key="$(echo "$status_response" | jq -r '.dayKey // empty')"
            job_json="$(echo "$status_response" | jq -c --arg day "$day_key" '([.recoveryJobs[]? | select(.agent_id == "app-development" and (.idempotency_key // "" | startswith("daily:" + $day + ":app-development:recovery:")))] | sort_by(.created_at // "") | last) // empty')"
            job_status="$(echo "$job_json" | jq -r '.status // empty')"

            echo "App Development recovery status: ${job_status:-not-yet-visible}"
            if [[ "$job_status" == "completed" ]]; then
              echo "App Development source generation job completed. Check the owner workspace for files and static validation."
              exit 0
            fi
            if [[ "$job_status" == "failed" ]]; then
              error="$(echo "$job_json" | jq -r '.last_error // "No failure detail returned."')"
              echo "App Development recovery failed: $error" >&2
              exit 1
            fi
            if [[ "$attempt" -lt 40 ]]; then sleep 30; fi
          done

          echo "App Development recovery did not finish within the monitoring window."
          exit 1
